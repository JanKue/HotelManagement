syntax = "proto3";

package hotelmanagement;

import "hotelmanagement/util.proto";

option java_multiple_files = true;
option java_package = "com.example.hotelmanagement.grpc";
option java_outer_classname = "GrpcGuest";

message GuestReply {
  int64 id = 1;
  string name = 2;
  CalendarDate dateOfBirth = 3;
}

message IdGuestRequest {
  int64 id = 1;
}

message CreateGuestRequest {
  string name = 1;
  CalendarDate dateOfBirth = 2;
}

message UpdateGuestRequest {
  int64 id = 1;
  string name = 2;
  CalendarDate dateOfBirth = 3;
}

message DeleteGuestReply {}

message ListGuestsReply {
  int64 id = 1;
  repeated GuestReply Guests = 2;
}

message GuestBalanceReply {
  int64 id = 1;
  double balance = 2;
}

message GuestDurationReply {
  int64 id = 1;
  int64 duration = 2;
}

message GuestQuarterRequest {
  int64 id = 1;
  int32 year = 2;
  int32 quarter = 3;
}